services:
  postgres:
    image: postgres:15
    container_name: digiflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digiflow
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: digiflow_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pg_data:
